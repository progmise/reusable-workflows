name: App CI Checks

# Reusable CI checks for app repos — invoked by each app's thin ci.yml
# (pull_request). Wraps app-ci-core.yml and adds Tracing + Summary.
# app-integration.yml / app-release.yml call app-ci-core directly and add
# their own reports, so Tracing/Summary never appear twice in a run.
#   Setup → Build artifact → Build image → SAST ‖ SCA ‖ CSA → Tracing → Summary

on:
  workflow_call:

jobs:
  core:
    name: Core
    uses: ./.github/workflows/app-ci-core.yml
    secrets: inherit

  # Tracing + Summary close the pipeline (in that order).
  tracing:
    name: Tracing
    runs-on: ubuntu-latest
    if: always()
    needs: [core]
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [core, tracing]
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Workflow summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/ci-summary.py \
            -o ci-summary.py && python3 ci-summary.py || true
