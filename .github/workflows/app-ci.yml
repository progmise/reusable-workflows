name: App CI Checks

# Reusable CI checks for API repos — invoked by each API's thin ci.yml
# (pull_request) and by app-integration.yml / app-release.yml (workflow_call).
# Same shape as the lib pipeline plus the container stages:
#   Setup → Build artifact → Build image → SAST ‖ SCA ‖ CSA → Tracing → Summary
# Callers that add their own Tracing/Summary at the end (integration, release)
# pass final-report: false so these jobs don't show up twice in the run.

on:
  workflow_call:
    inputs:
      final-report:
        required: false
        type: boolean
        default: true
        description: 'Emit Tracing + Summary jobs (false when the caller adds its own)'

jobs:
  setup:
    name: Setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment summary
        run: |
          {
            echo "### Setup"
            echo "- Repo: \`${{ github.repository }}\` @ \`${{ github.ref_name }}\` (${{ github.sha }})"
            echo "- Event: ${{ github.event_name }} by ${{ github.actor }}"
            if [ -f pom.xml ]; then echo "- Build: Maven"; else echo "- Build: Gradle"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build artifact
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: hashFiles('pom.xml') != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Build + test (Maven)
        if: hashFiles('pom.xml') != ''
        run: ./mvnw -B -ntp verify

      - uses: actions/setup-node@v4
        if: hashFiles('pom.xml') == '' && hashFiles('package.json') != ''
        with:
          node-version: '24'
          cache: npm

      - name: Build + test (npm)
        if: hashFiles('pom.xml') == '' && hashFiles('package.json') != ''
        run: npm ci && npm run build && npm test --if-present

      - name: Upload jar
        uses: actions/upload-artifact@v4
        if: hashFiles('pom.xml') != ''
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

      - name: Coverage summary
        if: hashFiles('pom.xml') != ''
        run: |
          CSV=$(find target -name 'jacoco*.csv' 2>/dev/null | head -1)
          test -n "$CSV" && awk -F',' 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
            printf "### Coverage\n" >> ENVIRON["GITHUB_STEP_SUMMARY"]
            printf "- Lines: **%.1f%%** (%d/%d)\n", lc/(lc+lm)*100, lc, lc+lm >> ENVIRON["GITHUB_STEP_SUMMARY"]
            printf "- Branches: **%.1f%%** (%d/%d)\n", (bc+bm)? bc/(bc+bm)*100 : 100, bc, bc+bm >> ENVIRON["GITHUB_STEP_SUMMARY"]
          }' "$CSV" || true

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('pom.xml') != ''
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30

  build-image:
    name: Build image
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is self-contained (maven build → layertools → jre);
      # no jar artifact needed here — it's only used by the SCA scan.
      - name: Docker build (local tag)
        id: image
        run: |
          REF="local/${{ github.event.repository.name }}:${{ github.sha }}"
          docker build -t "$REF" .
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Save image tarball
        run: docker save "local/${{ github.event.repository.name }}:${{ github.sha }}" | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tarball
          path: image.tar.gz
          retention-days: 7

  sast:
    name: SAST
    needs: build-image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep SAST
        run: pipx run semgrep scan --config p/java --error --metrics=off --json --output semgrep-results.json

      - name: Semgrep findings
        if: always()
        run: |
          test -f semgrep-results.json && jq -r '.results[]? |
            "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' semgrep-results.json || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 30

  # SCA scans the built jar (app-jar artifact), not the source tree: Trivy
  # resolves pom.xml parent/transitive POMs against Maven Central on `trivy fs .`
  # and anonymous GitHub-hosted runners hit 429 rate limits. Scanning the fat
  # jar's BOOT-INF/lib entries needs no remote resolution. Secrets are still
  # scanned on the source tree (local, no Maven calls).
  sca:
    name: SCA
    needs: build-image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        if: hashFiles('pom.xml') != ''
        with:
          name: app-jar
          path: scan-target/

      - name: Prepare scan target (npm)
        if: hashFiles('pom.xml') == ''
        run: |
          mkdir -p scan-target
          cp package*.json scan-target/ 2>/dev/null || true

      - name: Install Trivy
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz | tar -xz trivy
          sudo mv trivy /usr/local/bin/

      - name: Trivy vulnerability scan (jar/lockfiles)
        run: |
          for attempt in 1 2 3; do
            trivy fs --scanners vuln --severity CRITICAL,HIGH \
              --ignore-unfixed --format json --output trivy-results.json scan-target/ && break
            code=$?
            [ "$attempt" -eq 3 ] && exit "$code"
            sleep $((attempt * 60))
          done
          test -f trivy-results.json || exit 1
          count=$(jq '[.Results[]?.Vulnerabilities // empty | length] | add // 0' trivy-results.json)
          [ "$count" -eq 0 ] || exit 1

      - name: Trivy secret scan (source)
        run: |
          trivy fs --scanners secret --format json --output trivy-secrets.json . || true
          jq -r '.Results[]? | select(.Secrets) | .Target as $t | .Secrets[] |
            "SECRET\t\(.RuleID)\t\($t):\(.StartLine)"' trivy-secrets.json || true

      - name: Trivy findings
        if: always()
        run: |
          test -f trivy-results.json && jq -r '.Results[]? | select(.Vulnerabilities) |
            .Target as $t | .Vulnerabilities[] |
            "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion)\t(\($t))"' trivy-results.json || true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            trivy-results.json
            trivy-secrets.json
          retention-days: 30

  # CSA = container image scan of the artifact built by Build image.
  csa:
    name: CSA
    needs: build-image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tarball

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Install Trivy
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz | tar -xz trivy
          sudo mv trivy /usr/local/bin/

      - name: Trivy image scan
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --format json --output trivy-image-results.json \
            "local/${{ github.event.repository.name }}:${{ github.sha }}"
          count=$(jq '[.Results[]?.Vulnerabilities // empty | length] | add // 0' trivy-image-results.json)
          [ "$count" -eq 0 ] || exit 1

      - name: Image findings
        if: always()
        run: |
          test -f trivy-image-results.json && jq -r '.Results[]? | select(.Vulnerabilities) |
            .Target as $t | .Vulnerabilities[] |
            "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion)\t(\($t))"' trivy-image-results.json || true

      - name: Upload CSA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csa-report
          path: trivy-image-results.json
          retention-days: 30

  # Tracing + Summary close the pipeline (in that order). Suppressed when the
  # caller passes final-report: false (it adds its own at the end).
  tracing:
    name: Tracing
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.final-report }}
    needs: [setup, build, build-image, sast, sca, csa]
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.final-report }}
    needs: [setup, build, build-image, sast, sca, csa, tracing]
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Workflow summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/ci-summary.py \
            -o ci-summary.py && python3 ci-summary.py || true
