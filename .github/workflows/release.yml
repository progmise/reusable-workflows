name: Release

# Reusable release — invoked by each lib's thin release.yml (workflow_dispatch
# on main). Validates the version, runs all CI checks, publishes to Maven
# Central and creates the tag + GH Release.

on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Require main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::The Release workflow must run on main" && exit 1
          fi

      - name: Validate version
        id: version
        run: |
          v=$(grep -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts)
          if [ -z "$v" ]; then
            echo "::error::Could not read version from build.gradle.kts" && exit 1
          fi
          if [[ "$v" == *SNAPSHOT* ]]; then
            echo "::error::Cannot release a SNAPSHOT version: $v" && exit 1
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$v$"; then
            echo "::error::Tag $v already exists — bump the version" && exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: [validate, ci]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/init/publish.init.gradle.kts -o /tmp/publish.init.gradle.kts
          ./gradlew publishToMavenCentral --no-daemon -I /tmp/publish.init.gradle.kts

  release:
    needs: [validate, publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true

  # Tracing lives in telemetry.yml (shared with ci.yml) — emits spans +
  # gauges to Grafana Cloud; skips silently without GRAFANA_OTLP_* config.
  tracing:
    if: always()
    needs: [validate, ci, publish, release]
    uses: ./.github/workflows/telemetry.yml
    secrets: inherit
