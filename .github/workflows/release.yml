name: Release

# Reusable release — invoked by each lib's thin release.yml (workflow_dispatch
# on main). Validates the version, runs all CI checks, publishes to Maven
# Central and creates the tag + GH Release.

on:
  workflow_call:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        id: version
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/validate-release.py \
            -o validate-release.py && python3 validate-release.py

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Gate: japicmp fails the release when the API diff is incompatible with the
  # version bump being made (semver rules, incl. 0.x). Report stays in ci.yml.
  compat:
    name: Compat
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar (Gradle)
        if: hashFiles('pom.xml') == ''
        run: ./gradlew jar --no-daemon

      - name: Build jar (Maven)
        if: hashFiles('pom.xml') != ''
        run: ./mvnw -B -ntp -DskipTests package

      - name: API compatibility gate
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/api-compat.py \
            -o api-compat.py && python3 api-compat.py --gate

  publish:
    name: Publish
    needs: [validate, ci, compat]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish to Maven Central (Gradle)
        if: hashFiles('pom.xml') == ''
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/init/publish.init.gradle.kts -o /tmp/publish.init.gradle.kts
          ./gradlew publishToMavenCentral --no-daemon -I /tmp/publish.init.gradle.kts

      # Maven: the pom carries the central-publishing plugin; credentials go in
      # a generated settings.xml, the GPG key is imported in-memory, and the
      # `release` profile activates artifact signing.
      - name: Publish to Maven Central (Maven)
        if: hashFiles('pom.xml') != ''
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '<settings><servers><server><id>central</id><username>%s</username><password>%s</password></server></servers></settings>' \
            "$SONATYPE_USERNAME" "$SONATYPE_TOKEN" > /tmp/maven-settings.xml
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          ./mvnw -B -ntp -Prelease deploy -s /tmp/maven-settings.xml -Dgpg.passphrase="$GPG_PASSPHRASE"

  release:
    name: Release
    needs: [validate, publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true

  # Tracing + Summary close the pipeline (in that order). Tracing emits spans +
  # gauges to Grafana Cloud via OTLP/HTTP; skips silently without
  # GRAFANA_OTLP_ENDPOINT (var) + GRAFANA_OTLP_AUTH (secret).
  tracing:
    name: Tracing
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, ci, compat, publish, release]
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, ci, compat, publish, release, tracing]
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Workflow summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/ci-summary.py \
            -o ci-summary.py && python3 ci-summary.py || true
