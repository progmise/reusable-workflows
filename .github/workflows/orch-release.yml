name: Orchestrator Release

# Reusable — called by each app-model repo on merge to main.
# Topo-sorts the OAM definition, renders the dependency graph in the summary and
# creates a DRAFT GitHub Release v<version>. Publishing the draft is the
# manual approval gate — orch-deploy refuses to run on a draft release.
on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch topo-deploy script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/topo-deploy.py -o topo-deploy.py

      - name: Manifest file
        run: |
          M=manifest.yml
          [ -f oam-application-definition.yml ] && M=oam-application-definition.yml
          echo "MANIFEST=$M" >> "$GITHUB_ENV"

      - name: Validate + plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: |
          python topo-deploy.py validate "$MANIFEST"
          python topo-deploy.py plan "$MANIFEST"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python topo-deploy.py version "$MANIFEST")
          # A draft for this version may already exist (an earlier merge that
          # was never published) — replace it so the draft tracks main's OAM.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.draft and (.name == \"v$VER\" or .tag_name == \"v$VER\")) | .id" | head -1)
          [ -n "$ID" ] && gh api "repos/$GITHUB_REPOSITORY/releases/$ID" -X DELETE \
            && echo "replaced stale draft v$VER"
          gh release create "v$VER" --draft \
            --title "v$VER" \
            --notes "OAM release v$VER — publish to enable deploys." \
            --repo "$GITHUB_REPOSITORY"
          echo "draft release v$VER created — publish it to approve deploys"
