name: API Deploy

# Reusable deploy for API repos — invoked by each API's thin deploy.yml
# (workflow_dispatch). Deploys an already-released version (git tag + image on
# Docker Hub) to Vercel. Environments come from the caller's
# DEPLOY_ENVIRONMENTS variable (JSON list, default ["pro"]).

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Version (git tag) to deploy, e.g. 0.2.0'

permissions:
  contents: read
  actions: read

jobs:
  setup:
    name: Setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment summary
        run: |
          {
            echo "### Setup"
            echo "- Repo: \`${{ github.repository }}\` @ \`${{ github.ref_name }}\`"
            echo "- Deploy version: \`${{ inputs.version }}\`"
            echo "- Event: ${{ github.event_name }} by ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version + image
        env:
          DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          git ls-remote --exit-code --tags origin "$VERSION" > /dev/null \
            || { echo "::error::Tag $VERSION does not exist"; exit 1; }
          code=$(curl -sf -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${REPO}/tags/${VERSION}/" || true)
          [ "$code" = "200" ] || echo "::warning::Image ${DOCKER_USER}/${REPO}:${VERSION} not found on Docker Hub (code $code)"
          echo "Tag $VERSION OK"

  deploy:
    name: Deploy ${{ matrix.env }}
    needs: validate
    if: ${{ vars.VERCEL_PROJECT_ID != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJSON(vars.DEPLOY_ENVIRONMENTS || '["pro"]') }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ENV: ${{ matrix.env }}
        run: |
          npm i -g vercel@44
          PROD_FLAG=""; [ "$VERCEL_ENV" = "pro" ] && PROD_FLAG="--prod"
          URL=$(vercel deploy $PROD_FLAG --yes --token "$VERCEL_TOKEN" 2>&1 | tail -1)
          {
            echo "### Deploy ${{ matrix.env }} — ${{ inputs.version }}"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tracing + Summary close the pipeline (in that order).
  tracing:
    name: Tracing
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, validate, deploy]
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, validate, deploy, tracing]
    steps:
      - name: Workflow summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/ci-summary.py \
            -o ci-summary.py && python3 ci-summary.py || true
