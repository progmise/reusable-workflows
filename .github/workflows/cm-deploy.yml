name: CM Deploy

# Reusable deploy for ConfigMap components — invoked by each CM repo's thin
# deploy.yml (workflow_dispatch, or by the deploy-manifest orchestrator).
# Reads config/<environment>/application-<environment>.y*ml at the release
# tag and upserts each KEY as an env var on the target Vercel project
# (the manifest infra's properties.project, passed by the orchestrator).

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'ConfigMap version (git tag) to deploy, e.g. 0.2.0'
      environment:
        required: false
        type: string
        default: 'pro'
        description: 'Manifest environment (maps to vercel target: pro → production, else preview)'
      ci_id:
        required: false
        type: string
        default: ''
        description: 'Manifest infrastructures[].id this deploy targets (orchestrator passes it)'
      project:
        required: false
        type: string
        default: ''
        description: 'Target Vercel project — infra properties.project (orchestrator passes it; required)'

permissions:
  contents: read
  actions: read

jobs:
  setup:
    name: Setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment summary
        run: |
          {
            echo "### Setup"
            echo "- Repo: \`${{ github.repository }}\` @ \`${{ github.ref_name }}\`"
            echo "- Deploy version: \`${{ inputs.version }}\` → \`${{ inputs.environment }}\`"
            [ -n "${{ inputs.ci_id }}" ] && echo "- Infra (ci_id): \`${{ inputs.ci_id }}\`"
            echo "- Target project: \`${{ inputs.project }}\`"
            echo "- Event: ${{ github.event_name }} by ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate
    needs: setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Validate environment + version + config
        env:
          VERSION: ${{ inputs.version }}
          ENV: ${{ inputs.environment }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -e
          [ -n "$PROJECT" ] || { echo "::error::input 'project' is required — the target Vercel project (manifest infra properties.project)"; exit 1; }
          git ls-remote --exit-code --tags origin "$VERSION" > /dev/null \
            || { echo "::error::Tag $VERSION does not exist"; exit 1; }
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/cm-config.py -o cm-config.py
          python3 cm-config.py validate config
          python3 cm-config.py env "$ENV" config > /dev/null  # env file must exist

  deploy:
    name: Deploy ${{ inputs.environment }}
    needs: validate
    if: ${{ vars.VERCEL_ORG_ID != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Upsert env vars into Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          ENV: ${{ inputs.environment }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -e
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/cm-config.py -o cm-config.py
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/vercel-env-sync.py -o vercel-env-sync.py
          TARGET="preview"; [ "$ENV" = "pro" ] && TARGET="production"
          python3 cm-config.py env "$ENV" config | python3 vercel-env-sync.py "$PROJECT" "$TARGET"
          {
            echo "### Deploy ${{ inputs.environment }} — ${{ inputs.version }}"
            echo "- ConfigMap \`${{ github.event.repository.name }}\` → project \`$PROJECT\` (target \`$TARGET\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tracing + Summary close the pipeline (in that order).
  tracing:
    name: Tracing
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, validate, deploy]
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [setup, validate, deploy, tracing]
    steps:
      - name: Workflow summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/ci-summary.py \
            -o ci-summary.py && python3 ci-summary.py || true
