name: CI Checks

# Reusable CI checks — invoked by each lib's thin ci.yml (pull_request) and by
# the reusable Integration workflow (workflow_call). Wraps ci-core.yml and adds
# Tracing + Summary. release.yml calls ci-core directly and adds its own
# reports, so Tracing/Summary never appear twice in a run.

on:
  workflow_call:

jobs:
  core:
    name: Core
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  # Tracing + Summary close the pipeline (in that order). Tracing emits spans +
  # gauges to Grafana Cloud via OTLP/HTTP; skips silently without
  # GRAFANA_OTLP_ENDPOINT (var) + GRAFANA_OTLP_AUTH (secret). Summary needs
  # tracing so it always renders last.
  tracing:
    name: Tracing
    runs-on: ubuntu-latest
    if: always()
    needs: [core]
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [core, tracing]
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Workflow summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/ci-summary.py \
            -o ci-summary.py && python3 ci-summary.py || true

# ---------------------------------------------------------------------------
# Not ported from the reference pipeline (see README "Not ported"):
# - Threat Modeling validation: enterprise-internal tool, no free equivalent.
# - SCQA: SonarCloud is free for public repos only — could be enabled later.
# - CodeQL: free for public repos only (this repo may be private).
# - Required status checks on protected branches: pending first CI run to pin
#   the exact check names.
# - Commit/ticket validation: commitlint (conventional commits) is free if a
#   commit convention is adopted.
# ---------------------------------------------------------------------------
