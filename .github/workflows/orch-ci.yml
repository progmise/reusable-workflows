name: Orchestrator CI

# Reusable — called by each app-model repo on PRs to main.
# Validates the OAM definition end to end: schema, semver, version not
# already released, every component repo:tag exists, every image exists on
# Docker Hub. Reads oam-application-definition.yml, or manifest.yml on
# repos not yet migrated.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch topo-deploy script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/topo-deploy.py -o topo-deploy.py

      - name: Manifest file
        run: |
          M=manifest.yml
          [ -f oam-application-definition.yml ] && M=oam-application-definition.yml
          echo "MANIFEST=$M" >> "$GITHUB_ENV"

      - name: Validate manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: python topo-deploy.py validate "$MANIFEST"

      - name: Version not already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python topo-deploy.py version "$MANIFEST")
          if gh api "repos/$GITHUB_REPOSITORY/releases" \
             --jq '.[] | select(.draft | not) | .tag_name' | grep -qxE "v?$VER"; then
            echo "::error::release v$VER already exists in $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "version $VER is new"

      - name: Deploy plan
        run: python topo-deploy.py plan "$MANIFEST"
