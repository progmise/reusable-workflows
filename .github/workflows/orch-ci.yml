name: Orchestrator CI

# Reusable — called by the deploy-manifest repo on PRs to main.
# Validates manifest.yml end to end: schema, semver, version not already
# released, every component repo:tag exists, every image exists on Docker Hub.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch topo-deploy script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/topo-deploy.py -o topo-deploy.py

      - name: Validate manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        run: python topo-deploy.py validate manifest.yml

      - name: Version not already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -E '^version:' manifest.yml | cut -d' ' -f2 | tr -d '"')
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
             gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$VER already exists in $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "version $VER is new"

      - name: Deploy plan
        run: python topo-deploy.py plan manifest.yml
