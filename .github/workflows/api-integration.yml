name: API Integration

# Reusable integration for API repos — invoked by each API's thin
# integration.yml on merge to development/main. Publishes the image to Docker
# Hub tagged with the merge SHA (and :edge on development / :latest on main).
# Deploys are NOT automatic here — use the Deploy workflow (or Release) for
# that.

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/api-ci.yml
    secrets: inherit

  publish-image:
    name: Publish Image
    needs: ci
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tarball

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publish image
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.event.repository.name }}
        run: |
          IMAGE="docker.io/${{ vars.DOCKER_USERNAME }}/${REPO}"
          LOCAL="local/${REPO}:${SHA}"
          CHANNEL="edge"; [ "$REF_NAME" = "main" ] && CHANNEL="latest"
          docker tag "$LOCAL" "${IMAGE}:${SHA}"
          docker tag "$LOCAL" "${IMAGE}:${CHANNEL}"
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:${CHANNEL}"
          {
            echo "### Published image"
            echo "\`${IMAGE}:${SHA}\`"
            echo "\`${IMAGE}:${CHANNEL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
