name: Telemetry

# Reusable tracing job — invoked by ci.yml and release.yml so the emit logic
# exists once. The caller declares `needs:` on the calling job. Emits spans
# (real durations via the Jobs API) + gauges to Grafana Cloud via OTLP/HTTP;
# skips silently without GRAFANA_OTLP_ENDPOINT (var) + GRAFANA_OTLP_AUTH
# (secret).

on:
  workflow_call:

permissions:
  actions: read

jobs:
  tracing:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      OTLP_AUTH: ${{ secrets.GRAFANA_OTLP_AUTH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download run reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-report*'
          path: dl

      - name: Fetch telemetry script
        run: curl -sfL https://raw.githubusercontent.com/progmise/reusable-workflows/v1/scripts/emit-telemetry.py -o emit-telemetry.py

      - name: Emit run telemetry (OTLP/HTTP)
        run: python3 emit-telemetry.py
